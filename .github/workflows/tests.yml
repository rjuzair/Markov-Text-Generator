name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest
      - run: pytest -q
      - name: Smoke-test the command-line tools
        run: |
          ./text_stats.py shakespeare.txt > /dev/null
          ./generate_text.py shakespeare.txt king 50 --seed 1
